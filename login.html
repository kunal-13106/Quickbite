<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - QuickBite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">Quick<span>Bite</span></div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <section class="section" style="max-width:400px; margin:auto; padding:40px 20px;">
    <h1 class="section-title">Login to Your Account</h1>
    <form action="#" method="post">
      <div style="margin-bottom:15px;">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" style="width:100%; padding:10px; margin-top:5px;">
      </div>
      <div style="margin-bottom:15px;">
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" style="width:100%; padding:10px; margin-top:5px;">
      </div>
      <input type="submit" value="Login" class="btn" style="width:100%; padding:12px;">
    </form>
    <p style="margin-top:15px; text-align:center;">
      Not registered? <a href="#">Sign Up</a>
    </p>
  </section>

  <footer class="footer">
    <p>© 2025 QuickBite. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
